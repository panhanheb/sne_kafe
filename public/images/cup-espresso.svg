<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="espCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F362A"/>
      <stop offset="100%" stop-color="#2D1C14"/>
    </linearGradient>
    <linearGradient id="espSaucer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A3E31"/>
      <stop offset="100%" stop-color="#362217"/>
    </linearGradient>
    <linearGradient id="crema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49352"/>
      <stop offset="60%" stop-color="#9C5A2B"/>
      <stop offset="100%" stop-color="#5E3114"/>
    </linearGradient>
    <filter id="espShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#espShadow)">
    <!-- Saucer -->
    <ellipse cx="160" cy="270" rx="85" ry="13" fill="url(#espSaucer)"/>
    <ellipse cx="160" cy="268" rx="80" ry="11" fill="none" stroke="#6E4D3C" stroke-width="1.5" opacity="0.6"/>

    <!-- Small demitasse cup -->
    <path d="M100 150 C100 245 125 264 160 264 C195 264 220 245 220 150 Z" fill="url(#espCup)"/>
    <path d="M210 165 C248 170 248 220 208 224" stroke="#4F362A" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Top crema oval -->
    <ellipse cx="160" cy="150" rx="60" ry="22" fill="#241208"/>
    <ellipse cx="160" cy="149" rx="55" ry="19" fill="url(#crema)"/>

    <!-- Crema swirl -->
    <path d="M140 148 Q160 142 180 148" stroke="#F1C28D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Brand text -->
    <text x="160" y="218" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#D9A87C" text-anchor="middle" letter-spacing="1.5">SNE KAFE</text>
  </g>
</svg>
