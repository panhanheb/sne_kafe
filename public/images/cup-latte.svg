<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="75%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <linearGradient id="latteLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="18%" stop-color="#FFF5E5"/>
      <stop offset="22%" stop-color="#8E532B"/>
      <stop offset="42%" stop-color="#C99368"/>
      <stop offset="55%" stop-color="#EAD1B6"/>
      <stop offset="100%" stop-color="#F7ECE0"/>
    </linearGradient>
    <filter id="latteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#latteShadow)">
    <!-- Glass Body -->
    <path d="M102 70 L126 270 Q128 280 160 280 Q192 280 194 270 L218 70 Z" fill="url(#latteLayer)"/>

    <!-- Glass reflections and highlight -->
    <path d="M102 70 L126 270 Q128 280 160 280 Q192 280 194 270 L218 70 Z" fill="url(#glassWall)"/>
    <path d="M112 85 L132 265" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>

    <!-- Glass base highlight -->
    <ellipse cx="160" cy="276" rx="34" ry="7" fill="rgba(255,255,255,0.2)"/>

    <!-- Top Foam Rim -->
    <ellipse cx="160" cy="70" rx="58" ry="16" fill="#FFFDF9"/>
    <!-- Latte swirl -->
    <ellipse cx="160" cy="70" rx="30" ry="8" fill="#D99E73" opacity="0.8"/>
    <circle cx="160" cy="70" r="5" fill="#FFFDF9"/>

    <!-- Sne Kafe tag -->
    <rect x="130" y="150" width="60" height="20" rx="4" fill="rgba(43, 29, 22, 0.75)"/>
    <text x="160" y="164" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>
