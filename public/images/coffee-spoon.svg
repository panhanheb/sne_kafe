<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="woodHandle" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3D2012"/>
      <stop offset="30%" stop-color="#734426"/>
      <stop offset="70%" stop-color="#935732"/>
      <stop offset="100%" stop-color="#5E351B"/>
    </linearGradient>
    <linearGradient id="woodBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844D2B"/>
      <stop offset="50%" stop-color="#5E351B"/>
      <stop offset="100%" stop-color="#3A1F10"/>
    </linearGradient>
    <linearGradient id="spBeanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3824"/>
      <stop offset="100%" stop-color="#24130A"/>
    </linearGradient>
    <filter id="spoonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#spoonShadow)">
    <!-- Wooden Spoon Handle reaching diagonally to bottom right -->
    <path d="M260 175 Q360 210 490 280 L480 305 Q350 235 245 195 Z" fill="url(#woodHandle)"/>

    <!-- Spoon Oval Bowl -->
    <ellipse cx="170" cy="155" rx="110" ry="75" fill="url(#woodBowl)" transform="rotate(-15 170 155)"/>

    <!-- Inside depression of spoon -->
    <ellipse cx="168" cy="153" rx="98" ry="63" fill="#2A1409" transform="rotate(-15 168 153)"/>

    <!-- Coffee beans heaped in spoon -->
    <!-- Layer 1 -->
    <ellipse cx="120" cy="160" rx="28" ry="18" fill="url(#spBeanGrad)" transform="rotate(30 120 160)"/>
    <ellipse cx="150" cy="180" rx="27" ry="17" fill="url(#spBeanGrad)" transform="rotate(-20 150 180)"/>
    <ellipse cx="190" cy="170" rx="29" ry="19" fill="url(#spBeanGrad)" transform="rotate(45 190 170)"/>
    <ellipse cx="220" cy="150" rx="25" ry="16" fill="url(#spBeanGrad)" transform="rotate(-15 220 150)"/>

    <!-- Layer 2 (higher heap) -->
    <ellipse cx="130" cy="130" rx="26" ry="17" fill="#6A3F28" transform="rotate(-10 130 130)"/>
    <ellipse cx="170" cy="135" rx="30" ry="19" fill="#58331E" transform="rotate(25 170 135)"/>
    <ellipse cx="200" cy="125" rx="26" ry="16" fill="#4B2A17" transform="rotate(-35 200 125)"/>
    <ellipse cx="160" cy="110" rx="28" ry="18" fill="#6E432A" transform="rotate(5 160 110)"/>

    <!-- Creases on beans -->
    <path d="M110 160 Q120 155 130 160" stroke="#1A0A04" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M140 180 Q150 175 160 180" stroke="#1A0A04" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M180 170 Q190 165 200 170" stroke="#1A0A04" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M150 135 Q170 130 185 135" stroke="#1A0A04" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M150 110 Q160 106 170 110" stroke="#1A0A04" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Overflowing / Falling beans -->
    <ellipse cx="80" cy="180" rx="24" ry="16" fill="url(#spBeanGrad)" transform="rotate(55 80 180)"/>
    <path d="M72 180 Q80 175 88 180" stroke="#1A0A04" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="100" cy="225" rx="22" ry="15" fill="url(#spBeanGrad)" transform="rotate(-40 100 225)"/>
    <ellipse cx="130" cy="245" rx="20" ry="14" fill="url(#spBeanGrad)" transform="rotate(20 130 245)"/>
    <ellipse cx="60" cy="220" rx="18" ry="12" fill="url(#spBeanGrad)" transform="rotate(10 60 220)"/>
  </g>
</svg>

