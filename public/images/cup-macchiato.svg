<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="maccLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="12%" stop-color="#EAA34B"/>
      <stop offset="20%" stop-color="#FFF5E5"/>
      <stop offset="30%" stop-color="#7B4725"/>
      <stop offset="50%" stop-color="#C58D5F"/>
      <stop offset="65%" stop-color="#F2DFCB"/>
      <stop offset="100%" stop-color="#FFF9F2"/>
    </linearGradient>
    <linearGradient id="caramelDrizzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA34B"/>
      <stop offset="100%" stop-color="#A85710"/>
    </linearGradient>
    <filter id="maccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#maccShadow)">
    <!-- Glass Body -->
    <path d="M102 75 L126 270 Q128 280 160 280 Q192 280 194 270 L218 75 Z" fill="url(#maccLayer)"/>
    <!-- Glass reflection -->
    <path d="M112 90 L132 265" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Glass base highlight -->
    <ellipse cx="160" cy="276" rx="34" ry="7" fill="rgba(255,255,255,0.2)"/>

    <!-- Top Foam Rim -->
    <ellipse cx="160" cy="75" rx="58" ry="16" fill="#FFFDF9"/>

    <!-- Caramel crosshatch drizzle on top -->
    <path d="M130 75 Q160 85 190 75" stroke="url(#caramelDrizzle)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M135 68 Q160 76 185 68" stroke="url(#caramelDrizzle)" stroke-width="3" stroke-linecap="round"/>
    <path d="M135 82 Q160 90 185 82" stroke="url(#caramelDrizzle)" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 64 Q150 78 150 92" stroke="url(#caramelDrizzle)" stroke-width="3" stroke-linecap="round"/>
    <path d="M170 64 Q170 78 170 92" stroke="url(#caramelDrizzle)" stroke-width="3" stroke-linecap="round"/>

    <!-- Brand Tag -->
    <rect x="130" y="195" width="60" height="20" rx="4" fill="rgba(43, 29, 22, 0.85)"/>
    <text x="160" y="209" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>
