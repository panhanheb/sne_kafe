<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="ameCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="50%" stop-color="#2D1409"/>
      <stop offset="100%" stop-color="#140703"/>
    </linearGradient>
    <filter id="ameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#ameShadow)">
    <!-- Glass Body -->
    <path d="M104 80 L126 270 Q128 280 160 280 Q192 280 194 270 L216 80 Z" fill="url(#ameCoffee)"/>

    <!-- Glass base highlight -->
    <ellipse cx="160" cy="276" rx="34" ry="7" fill="rgba(255,255,255,0.2)"/>

    <!-- Ice cubes inside -->
    <rect x="130" y="105" width="28" height="28" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(15 144 119)"/>
    <rect x="155" y="145" width="26" height="26" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" transform="rotate(-20 168 158)"/>

    <!-- Glass reflection -->
    <path d="M112 90 L132 265" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>

    <!-- Rim -->
    <ellipse cx="160" cy="80" rx="56" ry="14" fill="rgba(255,255,255,0.3)"/>
    <ellipse cx="160" cy="80" rx="50" ry="10" fill="#4A2511"/>

    <!-- Brand Tag -->
    <rect x="130" y="195" width="60" height="20" rx="4" fill="rgba(43, 29, 22, 0.85)"/>
    <text x="160" y="209" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>
