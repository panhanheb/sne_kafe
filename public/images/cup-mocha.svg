<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="mochaCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F362A"/>
      <stop offset="100%" stop-color="#2D1C14"/>
    </linearGradient>
    <linearGradient id="mochaSaucer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A3E31"/>
      <stop offset="100%" stop-color="#362217"/>
    </linearGradient>
    <linearGradient id="chocoDrizzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38180E"/>
      <stop offset="100%" stop-color="#1A0A05"/>
    </linearGradient>
    <filter id="mochaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#mochaShadow)">
    <!-- Base saucer -->
    <ellipse cx="160" cy="270" rx="90" ry="14" fill="url(#mochaSaucer)"/>
    <ellipse cx="160" cy="268" rx="86" ry="12" fill="none" stroke="#6E4D3C" stroke-width="1.5" opacity="0.6"/>

    <!-- Ceramic cup -->
    <path d="M88 140 C88 238 120 262 160 262 C200 262 232 238 232 140 Z" fill="url(#mochaCup)"/>
    <path d="M222 158 C258 165 258 220 218 224" stroke="#4F362A" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Whipped Cream Tower -->
    <path d="M102 140 C102 110 130 90 160 80 C190 90 218 110 218 140 Z" fill="#FFFDF8"/>
    <!-- Cream swirls -->
    <path d="M120 135 C130 115 150 105 165 105 C185 105 195 120 205 135" stroke="#EADDCF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M140 115 C150 95 160 85 160 70 C165 85 175 95 180 115" stroke="#EADDCF" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Chocolate Drizzle -->
    <path d="M130 120 Q145 140 160 125 Q175 110 190 130" stroke="url(#chocoDrizzle)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M145 95 Q160 110 170 100" stroke="url(#chocoDrizzle)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Sne Kafe brand text on cup -->
    <text x="160" y="215" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#D9A87C" text-anchor="middle" letter-spacing="1.5">SNE KAFE</text>
  </g>
</svg>
