<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="coldBrewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1D0F"/>
      <stop offset="60%" stop-color="#241008"/>
      <stop offset="100%" stop-color="#140602"/>
    </linearGradient>
    <filter id="cbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#cbShadow)">
    <ellipse cx="160" cy="285" rx="80" ry="14" fill="#1C120C" opacity="0.6"/>
    <!-- Can / Glass Body -->
    <path d="M106 80 L124 270 Q126 280 160 280 Q194 280 196 270 L214 80 Z" fill="url(#coldBrewGrad)"/>

    <!-- Large Clear Ice sphere inside -->
    <circle cx="160" cy="140" r="32" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="14" ry="7" fill="rgba(255,255,255,0.25)" transform="rotate(-30 150 130)"/>

    <!-- Glass reflection -->
    <path d="M114 90 L130 265" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>

    <!-- Lemon / Orange slice garnish on rim -->
    <circle cx="195" cy="76" r="22" fill="#E89F3B" stroke="#FCE49E" stroke-width="2.5"/>
    <circle cx="195" cy="76" r="17" fill="#F5AC33"/>
    <path d="M195 59 L195 93 M178 76 L212 76 M183 64 L207 88 M183 88 L207 64" stroke="#FCE49E" stroke-width="1.5"/>

    <!-- Rim -->
    <ellipse cx="160" cy="80" rx="54" ry="14" fill="rgba(255,255,255,0.35)"/>
    <ellipse cx="160" cy="80" rx="48" ry="10" fill="#3D1D0F"/>

    <!-- Brand Tag -->
    <rect x="130" y="195" width="60" height="20" rx="4" fill="rgba(43, 29, 22, 0.85)"/>
    <text x="160" y="209" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>

