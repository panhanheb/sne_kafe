<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="beanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#543321"/>
      <stop offset="60%" stop-color="#3A2114"/>
      <stop offset="100%" stop-color="#1F0E07"/>
    </linearGradient>
    <linearGradient id="beanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A422B"/>
      <stop offset="50%" stop-color="#462717"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>
    <filter id="bShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Bean 1 -->
  <g filter="url(#bShadow)" transform="rotate(-25 90 90)">
    <ellipse cx="90" cy="90" rx="35" ry="24" fill="url(#beanGrad1)"/>
    <path d="M62 90 Q90 82 90 90 Q90 98 118 90" stroke="#1F0E07" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="80" cy="80" rx="15" ry="5" fill="rgba(255,255,255,0.12)" transform="rotate(-15 80 80)"/>
  </g>

  <!-- Bean 2 -->
  <g filter="url(#bShadow)" transform="rotate(35 150 140)">
    <ellipse cx="150" cy="140" rx="38" ry="26" fill="url(#beanGrad2)"/>
    <path d="M120 140 Q150 130 150 140 Q150 150 180 140" stroke="#1F0E07" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="140" cy="130" rx="16" ry="6" fill="rgba(255,255,255,0.14)" transform="rotate(-10 140 130)"/>
  </g>

  <!-- Bean 3 -->
  <g filter="url(#bShadow)" transform="rotate(-65 170 60)">
    <ellipse cx="170" cy="60" rx="26" ry="18" fill="url(#beanGrad1)"/>
    <path d="M150 60 Q170 54 170 60 Q170 66 190 60" stroke="#1F0E07" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Bean 4 (small) -->
  <g filter="url(#bShadow)" transform="rotate(15 65 170)">
    <ellipse cx="65" cy="170" rx="28" ry="19" fill="url(#beanGrad2)"/>
    <path d="M44 170 Q65 163 65 170 Q65 177 86 170" stroke="#1F0E07" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>

