<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="croissantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A758"/>
      <stop offset="50%" stop-color="#C27A2F"/>
      <stop offset="100%" stop-color="#7A4212"/>
    </linearGradient>
    <linearGradient id="crustGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE1A9"/>
      <stop offset="50%" stop-color="#DDA154"/>
      <stop offset="100%" stop-color="#A45E20"/>
    </linearGradient>
    <filter id="croissShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#croissShadow)">
    <!-- Base Plate -->
    <ellipse cx="160" cy="245" rx="125" ry="32" fill="#2E1B13" stroke="#482E22" stroke-width="2"/>
    <ellipse cx="160" cy="243" rx="100" ry="22" fill="#1C100B"/>

    <!-- Golden Croissant Body -->
    <path d="M70 200 C60 160 100 120 160 120 C220 120 260 160 250 200 C235 225 210 205 160 205 C110 205 85 225 70 200 Z" fill="url(#croissantGrad)"/>

    <!-- Crescent folds / Flaky layers -->
    <!-- Center roll -->
    <ellipse cx="160" cy="165" rx="42" ry="38" fill="url(#crustGlow)"/>
    <path d="M135 155 Q160 145 185 155 Q160 180 135 155 Z" fill="#9E581E"/>

    <!-- Left curved tip -->
    <path d="M125 155 C110 145 80 160 70 200 C80 205 105 190 125 180 Z" fill="url(#crustGlow)"/>
    <!-- Right curved tip -->
    <path d="M195 155 C210 145 240 160 250 200 C240 205 215 190 195 180 Z" fill="url(#crustGlow)"/>

    <!-- Glaze shine highlights -->
    <path d="M138 140 Q160 130 182 140" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
    <path d="M95 165 Q115 155 125 165" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M195 165 Q205 155 225 165" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Brand stamp plate tag -->
    <rect x="130" y="240" width="60" height="18" rx="4" fill="rgba(43, 29, 22, 0.9)"/>
    <text x="160" y="252" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>

