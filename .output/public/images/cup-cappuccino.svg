<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="capCup" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#473126"/>
      <stop offset="100%" stop-color="#241711"/>
    </linearGradient>
    <linearGradient id="capFoam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F2E6D8"/>
      <stop offset="100%" stop-color="#B78864"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#capShadow)">
    <!-- Saucer -->
    <ellipse cx="160" cy="275" rx="130" ry="22" fill="#362219" stroke="#52392C" stroke-width="2"/>
    <ellipse cx="160" cy="273" rx="100" ry="14" fill="#241711"/>

    <!-- Cup Body -->
    <path d="M85 130 C85 240 120 265 160 265 C200 265 235 240 235 130 Z" fill="url(#capCup)"/>
    <path d="M225 150 C265 155 265 220 220 225" stroke="#3E291F" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Thick Cappuccino Foam Dome -->
    <ellipse cx="160" cy="130" rx="75" ry="32" fill="url(#capFoam)"/>
    <!-- Cocoa sprinkles -->
    <circle cx="150" cy="126" r="2.5" fill="#4A2613"/>
    <circle cx="162" cy="122" r="2" fill="#4A2613"/>
    <circle cx="170" cy="128" r="3" fill="#4A2613"/>
    <circle cx="145" cy="132" r="1.8" fill="#4A2613"/>
    <circle cx="158" cy="135" r="2.2" fill="#4A2613"/>
    <circle cx="175" cy="133" r="1.5" fill="#4A2613"/>
    <circle cx="138" cy="125" r="2" fill="#4A2613"/>

    <!-- Sne Kafe brand text on cup -->
    <text x="160" y="215" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#D9A87C" text-anchor="middle" letter-spacing="1.5">SNE KAFE</text>
  </g>
</svg>

