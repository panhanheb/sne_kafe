<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="ameGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="ameCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B2A18"/>
      <stop offset="70%" stop-color="#281208"/>
      <stop offset="100%" stop-color="#140703"/>
    </linearGradient>
    <filter id="ameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#ameShadow)">
    <!-- Base Plate -->
    <ellipse cx="160" cy="285" rx="80" ry="14" fill="#1C120C" opacity="0.6"/>

    <!-- Glass Body -->
    <path d="M104 80 L126 270 Q128 280 160 280 Q192 280 194 270 L216 80 Z" fill="url(#ameCoffee)"/>

    <!-- Ice cubes inside -->
    <rect x="130" y="105" width="28" height="28" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(15 144 119)"/>
    <rect x="162" y="135" width="26" height="26" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" transform="rotate(-10 175 148)"/>
    <rect x="135" y="170" width="25" height="25" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" transform="rotate(25 147 182)"/>

    <!-- Glass highlights -->
    <path d="M104 80 L126 270 Q128 280 160 280 Q192 280 194 270 L216 80 Z" fill="url(#ameGlass)"/>
    <path d="M112 95 L130 265" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Rim -->
    <ellipse cx="160" cy="80" rx="56" ry="14" fill="rgba(255,255,255,0.4)"/>
    <ellipse cx="160" cy="80" rx="50" ry="11" fill="#4B2A18"/>

    <!-- Brand Tag -->
    <rect x="130" y="210" width="60" height="20" rx="4" fill="rgba(43, 29, 22, 0.85)"/>
    <text x="160" y="224" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="#D9A87C" text-anchor="middle" letter-spacing="1">SNE KAFE</text>
  </g>
</svg>

