<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <radialGradient id="liquidGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#804E2D"/>
      <stop offset="60%" stop-color="#4E2B15"/>
      <stop offset="100%" stop-color="#281308"/>
    </radialGradient>
    <filter id="liquidGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#liquidGlow)">
    <!-- Swirling waves -->
    <path d="M120 280 C80 200 160 140 220 180 C280 220 340 160 380 190 C420 220 440 300 390 350 C340 400 240 430 180 390 C130 350 140 320 120 280 Z" fill="url(#liquidGrad)" opacity="0.85"/>
    <path d="M220 120 C250 80 280 100 270 140 C250 170 210 160 220 120 Z" fill="url(#liquidGrad)"/>
    <path d="M380 150 C420 120 440 160 410 180 C390 190 360 170 380 150 Z" fill="url(#liquidGrad)"/>
    
    <!-- Droplets -->
    <circle cx="100" cy="180" r="10" fill="#6B3F21"/>
    <circle cx="130" cy="140" r="7" fill="#8A532C"/>
    <circle cx="160" cy="100" r="13" fill="#583118"/>
    <circle cx="320" cy="90" r="9" fill="#784423"/>
    <circle cx="430" cy="230" r="14" fill="#6B3F21"/>
    <circle cx="450" cy="280" r="8" fill="#8A532C"/>
    <circle cx="400" cy="380" r="12" fill="#583118"/>
    <circle cx="140" cy="420" r="9" fill="#784423"/>
  </g>
</svg>

